name: Build CV (tutoring)

# PDF builds remain manual: the CV is built locally with build_cv.sh and the
# PDF committed by hand. The `build` job below is still dispatch-only and
# nothing here commits to the repository.
#
# The `verify` job does run on push, because this variant overrides two tier-1
# shared section files and one of them can absorb shared content silently on a
# rebase -- see the header of sections/courses.tex. It only builds and
# inspects the result.
on:
  workflow_dispatch:
  push:
    branches: [tutoring]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF by branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_FILE="${BRANCH//\//-}"
          MONTH=$(date +%b | tr '[:upper:]' '[:lower:]')
          YEAR=$(date +%Y)
          mv main.pdf "kyle_wong_cv_${MONTH}_${YEAR}_${BRANCH_FILE}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: kyle_wong_cv_*.pdf

  verify:
    name: Page budget (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Report page count and text-block overruns
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'CHECK'
          import os, re, subprocess

          # ADVISORY. This step never fails the run: it annotates and writes to
          # the job summary, leaving the decision to a person. A layout that
          # differs here is not necessarily wrong -- page breaks depend on the
          # TeX distribution, and the runner's may not match the one the
          # committed PDF was built with locally.
          EXPECTED = 1
          MARGIN_PT = 54.0  # 0.75in, per \geometry in main.tex

          pages = int(subprocess.run(["pdfinfo", "main.pdf"], capture_output=True,
                                     text=True, check=True
                                     ).stdout.split("Pages:")[1].split()[0])
          bbox = subprocess.run(["pdftotext", "-bbox", "main.pdf", "-"],
                                capture_output=True, text=True, check=True).stdout
          height = float(re.search(r'height="([\d.]+)"', bbox).group(1))
          floor = height - MARGIN_PT

          worst = None
          for idx, page in enumerate(bbox.split("<page")[1:], 1):
              words = re.findall(
                  r'<word xMin="[\d.]+" yMin="[\d.]+" xMax="[\d.]+" yMax="([\d.]+)"[^>]*>([^<]*)</word>',
                  page)
              # fancyhdr sets the page number in the bottom margin by design, so
              # it is not an overrun. Drop a word below the text block that is
              # exactly this page's number; anything else there has spilled.
              body = [float(y) for y, t in words
                      if not (float(y) > floor and t.strip() == str(idx))]
              if not body:
                  continue
              slack = floor - max(body)
              if worst is None or slack < worst[1]:
                  worst = (idx, slack)

          notes = []
          if pages != EXPECTED:
              notes.append(f"expected {EXPECTED} page(s), built {pages}")
          if worst and worst[1] < 0:
              notes.append(f"page {worst[0]} overruns the text block by "
                           f"{-worst[1]:.1f}pt")

          headline = (f"pages={pages} (expected {EXPECTED}); tightest page="
                      f"{worst[0]} slack={worst[1]:.1f}pt" if worst else
                      f"pages={pages} (expected {EXPECTED}); no text found")
          print(headline)
          for n in notes:
              print(f"::warning title=Page budget::{n}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### Page budget (advisory)\n\n")
                  fh.write(f"`{headline}`\n\n")
                  if notes:
                      for n in notes:
                          fh.write(f"- :warning: {n}\n")
                      fh.write(
                          "\nThis does not fail the build. Rebuild locally with "
                          "`build_cv.sh` and compare before acting; if a rebase "
                          "from `main` auto-merged shared content into an "
                          "overridden section file, that is the usual cause.\n")
                  else:
                      fh.write("Within budget.\n")
          CHECK
