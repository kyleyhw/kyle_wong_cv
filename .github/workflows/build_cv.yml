name: Build CV (tutoring)

# PDF builds remain manual: the CV is built locally with build_cv.sh and the
# PDF committed by hand. The `build` job below is still dispatch-only and
# nothing here commits to the repository.
#
# The `verify` job does run on push, because this variant overrides two tier-1
# shared section files and one of them can absorb shared content silently on a
# rebase -- see the header of sections/courses.tex. It only builds and
# inspects the result.
on:
  workflow_dispatch:
  push:
    branches: [tutoring]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF by branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_FILE="${BRANCH//\//-}"
          MONTH=$(date +%b | tr '[:upper:]' '[:lower:]')
          YEAR=$(date +%Y)
          mv main.pdf "kyle_wong_cv_${MONTH}_${YEAR}_${BRANCH_FILE}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: kyle_wong_cv_*.pdf

  verify:
    name: One-page budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Assert one page, with content inside the bottom margin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'CHECK'
          import re, subprocess, sys

          # Page count alone is too weak a guard. An absorbed course first eats
          # the bottom margin and only later forces a second page, so a
          # pages-only assertion passes a layout that already overruns. Assert
          # both: one page, and the last baseline still above the 54pt margin.
          MARGIN_PT = 54.0  # 0.75in, per \geometry in main.tex

          pages = int(subprocess.run(
              ["pdfinfo", "main.pdf"], capture_output=True, text=True, check=True
          ).stdout.split("Pages:")[1].split()[0])

          bbox = subprocess.run(
              ["pdftotext", "-bbox", "main.pdf", "-"],
              capture_output=True, text=True, check=True,
          ).stdout
          height = float(re.search(r'height="([\d.]+)"', bbox).group(1))
          last = max(float(y) for y in re.findall(r'yMax="([\d.]+)"', bbox))
          slack = height - last - MARGIN_PT

          print(f"pages={pages}  slack below last line={slack:.1f}pt")
          if pages != 1:
              sys.exit(f"::error::Tutoring CV must be one page; this build is {pages}.")
          if slack < 0:
              sys.exit(
                  f"::error::Content overruns the bottom margin by {-slack:.1f}pt. "
                  "A rebase from main may have auto-merged shared courses into "
                  "sections/courses.tex -- check it against that file's header note."
              )
          CHECK
