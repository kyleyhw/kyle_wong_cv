name: Build CV (industry-quantum-consulting)

# Automatic builds are DISABLED. The CV PDF is built locally with build_cv.sh
# and committed manually. Trigger a build by hand from the Actions tab
# ("Run workflow") if needed, or restore a `push:` trigger to re-enable
# automatic builds.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF by branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_FILE="${BRANCH//\//-}"
          MONTH=$(date +%b | tr '[:upper:]' '[:lower:]')
          YEAR=$(date +%Y)
          mv main.pdf "kyle_wong_cv_${MONTH}_${YEAR}_${BRANCH_FILE}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: kyle_wong_cv_*.pdf
